[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control-desviaciones-pozo"
version = "1.1.0"
description = "Análisis de variaciones partida por partida entre el costo programado y el ejecutado de un pozo exploratorio."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Toledo Ordaz" }]
keywords = ["ciencia de datos", "análisis de variaciones", "control de costos", "perforación"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "ipykernel>=6.25",
]

[project.scripts]
costos = "costos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 150
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.coverage.run]
source = ["costos"]
